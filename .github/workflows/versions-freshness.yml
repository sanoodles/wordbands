name: Pinned versions

# Dependabot moves the npm packages and the actions, but not Node's version or pnpm's. This
# reads upstream once a week and turns red when either pin trails a major, so a stall shows
# up rather than sitting unnoticed. GitHub emails a scheduled run's failure to whoever last
# edited its cron.
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: node scripts/check-versions.mjs
