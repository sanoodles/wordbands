name: Vendored skills freshness

# Every skill under .claude/skills/ is vendored from somewhere else: three from
# vercel/next.js@canary/skills, and fondue from Frontify. Nothing in the repo pulls on
# them, so they rot silently — this is the only thing that looks. Drift arrives as a PR to
# review rather than as a silent swap, which is the same bargain Dependabot makes for the
# npm deps.
#
# Off the hour on purpose: GitHub queues cron runs at :00 and delays them under load.
# GitHub also disables scheduled workflows after 60 days without repo activity, so a
# long-quiet repo stops checking; workflow_dispatch is the manual way back.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Nothing here is granted at the top: `sync` runs third-party code and `propose` writes,
# and they are split so no job does both. See the note on `propose`.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH: chore/skills-sync
  # Every path either sync can write. Used by the drift check, the artifact and the commit
  # alike, so they cannot disagree about what is being watched.
  WATCH: .claude/skills .agents skills-lock.json

jobs:
  # Runs `npx skills@latest`, which is unpinned third-party code from npm. Upstream's own
  # install instructions are unpinned and pinning would rot, so the exposure is accepted —
  # but it is accepted in a job whose token cannot write. What comes out of here is a
  # tarball, and the job that can push never runs the CLI.
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      found: ${{ steps.drift.outputs.found }}
      report: ${{ steps.sync.outputs.report }}
      changed: ${{ steps.drift.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # No pnpm install: the script is plain Node with no dependencies.
      - id: sync
        env:
          # Raises the API budget from 60/hour per IP to 1000, and the script needs one call.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'report<<REPORT'
            node scripts/sync-next-skills.mjs
            echo REPORT
          } >> "$GITHUB_OUTPUT"

      # Frontify's skill is not in the Next.js tree, so the script above cannot see it.
      # Its own CLI is the upstream-blessed way to refresh it, and it is a no-op when
      # nothing changed — verified by running it twice against a clean tree.
      #
      # `skills update` exits 0 whether it refreshed the skill or never found it, so the
      # check runs either side: before, so a green step cannot mean "saw nothing", and
      # after, so a layout the update rewrote is caught before it reaches a commit.
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          DO_NOT_TRACK: "1"
        run: |
          node scripts/check-fondue-install.mjs
          npx -y skills@latest update -y
          node scripts/check-fondue-install.mjs

      # .agents/ holds fondue's real files and .claude/skills/fondue is a symlink to them,
      # so watching .claude/skills alone would miss every fondue update.
      - id: drift
        run: |
          if [ -n "$(git status --porcelain $WATCH)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            # The script's own report covers the Next.js three. A week where only fondue
            # moved would otherwise open a PR whose body reads "up to date".
            {
              echo 'changed<<CHANGED'
              git status --porcelain $WATCH
              echo CHANGED
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # tar, not the artifact action's own file walk: .claude/skills/fondue is a symlink,
      # and an uploader that follows it would hand `propose` a directory where the repo
      # keeps a link — which is exactly the broken layout check-fondue-install.mjs exists
      # to catch. tar stores the link itself.
      - if: steps.drift.outputs.found == 'true'
        run: tar -cf skills.tar $WATCH

      - if: steps.drift.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synced-skills
          path: skills.tar
          retention-days: 1

  # The only job that can write, and it runs no third-party code. It still commits what
  # the CLI produced, so a compromised CLI can still put files in front of a reviewer —
  # what it can no longer do is push to a branch, open a PR, or dispatch a workflow on
  # its own.
  propose:
    needs: sync
    if: needs.sync.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Only to dispatch pr.yml on the branch this opens — see the last step.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: synced-skills

      # Delete before untarring: a tar of the synced tree carries what upstream added and
      # changed, but nothing records what it removed. Restoring onto an emptied path makes
      # the working tree match the sync exactly, deletions included.
      - run: |
          rm -rf $WATCH
          tar -xf skills.tar
          rm -f skills.tar

      # One long-lived branch, force-pushed: a second week of drift updates the open PR
      # instead of opening a rival one against the same files.
      - env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.sync.outputs.report }}
          CHANGED: ${{ needs.sync.outputs.changed }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add -A $WATCH
          git commit -m 'chore: update vendored skills from upstream' \
            -m "Synced by .github/workflows/skills-freshness.yml from vercel/next.js@canary/skills and Frontify/fondue." \
            -m "$REPORT" \
            -m "$CHANGED"
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title 'chore: update vendored skills from upstream' \
              --body "$(printf 'Upstream drift in the vendored skills. Reproduce locally with `pnpm skills:sync`.\n\n```\n%s\n```\n\nChanged paths:\n\n```\n%s\n```\n' "$REPORT" "$CHANGED")"
          fi

      # A push made with github.token raises no pull_request event, so pr.yml never runs
      # on the PR. Dispatching it on the branch runs it all the same, and the result shows
      # in the Actions tab. GitHub neither counts a dispatched run's `check` toward the one
      # branch protection requires nor shows it on the PR. Closing and reopening the PR by
      # hand fires the events from a human actor, and that run counts.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pr.yml --ref "$BRANCH"
