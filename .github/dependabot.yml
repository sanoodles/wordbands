# Dependency drift is a clock, not a mistake: the advisories that prompted this were a
# lockfile left behind by a range that already allowed the fix. Weekly, grouped, so a
# quiet week is one merge rather than a page of them.
version: 2
updates:
  - package-ecosystem: "npm"
    # One entry, and it is the root. This is a pnpm workspace, so the lockfile lives there
    # and an update from it rewrites apps/web/package.json and pnpm-lock.yaml together.
    # Listing "/apps/web" as well opened a second PR per dependency that edited the
    # manifest alone — there is no lockfile in that directory to update — and every one of
    # those failed `pnpm install --frozen-lockfile`, in CI and on Vercel alike.
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Was 5, which is per directory — so dropping "/apps/web" halved the real budget at
    # the same time as the majors started arriving. The root hit 5 exactly on 24 Aug.
    open-pull-requests-limit: 8
    commit-message:
      prefix: "chore"
      include: "scope"
    # Majors that cannot install here, because something else pins the peer range. Left
    # alone Dependabot re-proposes them on every patch release — a red PR a week for a
    # bump that fails `pnpm install` before anything runs.
    #
    # Each entry states the peer that blocks it, and `pnpm ignores:check` reads that claim
    # out of this file and compares it against pnpm-lock.yaml. So when the peer widens,
    # the check fails and says so; without it an ignore is a thing nothing pulls on.
    ignore:
      # blocked-by: @frontify/fondue-tokens peers tailwindcss ^3.4.17
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # blocked-by: @typescript-eslint/parser peers typescript >=4.8.4 <6.1.0
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Routine churn, batched. Majors stay out of these on purpose — they are the ones
      # that change behaviour, and they deserve a PR and a read of their own.
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    # The workflows pin each action by its major tag, so nothing moves them unless this
    # does. "/" is where Dependabot looks for .github/workflows.
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    # The pin is a major tag, so every PR here is a new major, and each gets a read of its
    # own. The two artifact actions are the exception: skills-freshness.yml uploads with one
    # and downloads with the other, and v4 could not read what v3 had uploaded.
    groups:
      artifacts:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
