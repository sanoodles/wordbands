packages:
  - apps/*

allowBuilds:
  esbuild: true
  sharp: false

# A peer range we accept rather than match. Each entry states its reason on the line above
# it, and `pnpm ignores:check` fails when the package's own range stops matching the claim.
peerDependencyRules:
  allowedVersions:
    # accepted-over: eslint-plugin-jsx-a11y peers eslint ^3 || ^4 || ^5 || ^6 || ^7 || ^8 || ^9
    eslint-plugin-jsx-a11y>eslint: "10"
